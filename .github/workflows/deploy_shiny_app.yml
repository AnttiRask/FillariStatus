name: Deploy to Cloud Run

# Deploys on pushes to main that change the app or how it is built (not docs,
# tests or the plan), and on demand: Actions tab > "Deploy to Cloud Run" > Run
# workflow. Keep the service flags in sync with deploy.sh.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "renv.lock"
      - ".Rprofile"
      - "renv/activate.R"
      - "renv/settings.json"
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: europe-north1
  SERVICE: fillaristatus-app
  AR_REPO: cloud-run-source-deploy

jobs:
  # The tests must pass before anything is built or deployed
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    # Pinned, not ubuntu-latest: the label moved to Ubuntu 26.04 on 2026-10-31, and the
    # project (like BiblioStatus) is built for 24.04. Move on purpose, after testing.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write  # keyless Google Cloud login (Workload Identity Federation)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/884476669514/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build container image
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$AR_REPO/$SERVICE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          BUILD_ID=$(gcloud builds submit \
            --tag "$IMAGE" \
            --region "$REGION" \
            --timeout 3600 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --async \
            --format='value(id)')

          echo "Build ID: $BUILD_ID"

          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --region "$REGION" \
              --project ${{ secrets.GCP_PROJECT_ID }} \
              --format='value(status)')
            echo "Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              break
            elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "TIMEOUT" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "INTERNAL_ERROR" ]; then
              echo "Build failed with status: $STATUS"
              echo "--- Cloud Build logs (tail) ---"
              gcloud builds log "$BUILD_ID" \
                --region "$REGION" \
                --project ${{ secrets.GCP_PROJECT_ID }} | tail -100
              exit 1
            fi
            sleep 30
          done

      - name: Deploy to Cloud Run
        run: |
          # --set-secrets replaces all existing secrets, which also drops the map-tile
          # key that earlier revisions used
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --platform managed \
            --region "$REGION" \
            --allow-unauthenticated \
            --memory 1Gi \
            --timeout 3600 \
            --session-affinity \
            --service-account fillaristatus-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --max-instances 3 \
            --concurrency 20 \
            --set-secrets "DIGITRANSIT_SUBSCRIPTION_KEY=digitransit-subscription-key:latest" \
            --update-labels "git-sha=${GITHUB_SHA::12}" \
            --project ${{ secrets.GCP_PROJECT_ID }}

      # Fails the run unless the service carries this commit's label and the
      # page answers HTTP 200
      - name: Smoke test the deployed service
        run: |
          read -r URL LABEL < <(gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format='value(status.url,metadata.labels.git-sha)')
          echo "Service URL: $URL"
          echo "Deployed commit label: $LABEL (this run: ${GITHUB_SHA::12})"
          if [ "$LABEL" != "${GITHUB_SHA::12}" ]; then
            echo "The service doesn't carry this commit's label"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$URL/" || true)
            echo "Attempt $attempt: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "OK"
              exit 0
            fi
            sleep 10
          done
          echo "Service did not return HTTP 200"
          exit 1
